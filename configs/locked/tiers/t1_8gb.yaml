    - instance: extractor
      roles: [extractor]
      hf_id: Qwen/Qwen2.5-0.5B-Instruct
      gguf: F16
      weight_gb_approx: 1.0
    - instance: verifier
      roles: [verifier]
      hf_id: Qwen/Qwen2.5-0.5B-Instruct
      gguf: F16
      weight_gb_approx: 1.0
  retriever:
    hf_id: BAAI/bge-small-en-v1.5
