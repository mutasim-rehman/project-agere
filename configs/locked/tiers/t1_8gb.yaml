tier_id: t1
name: 8 GB legacy analyst laptop
primary: false
# Nominal cap; recompute a possibly lower effective cap from the actual host before every run.
physical_ram_gb: 8
nominal_os_background_reserve_fraction: 0.20
nominal_os_background_reserve_gb: 1.6
nominal_peak_rss_cap_gb: 6.4
safety_headroom_gb: 1.0
effective_peak_rss_cap_formula: min(nominal_peak_rss_cap_gb, host_physical_ram_gb - measured_idle_non_job_use_gb - safety_headroom_gb)
peak_rss_cap_gb: 6.4
cap_is_ceiling_not_utilization_target: true
context_tokens: 4096
thinking_token_cap: 2048
thinking_token_sweep: [1024, 2048, 4096]
runtime: llama.cpp
device: cpu
effective_cap_must_be_measured_before_each_run: true
job_must_be_capped_at_effective_rss_budget: true

sas:
  arm: SAS-Quant
  hf_id: Qwen/Qwen2.5-7B-Instruct
  gguf: Q4_K_M
  weight_gb_approx: 4.7
  finetune: qlora_nf4_then_requant_q4_k_m
  finetune_gpu_vram_gb: 12
  finetune_fallback: cpu_offload_or_any_gpu_that_holds_7b_nf4

mas:
  arm: MAS-FP16
  generative_model_count: 3
  residency_primary: resident
  residency_secondary: sequential
  weight_sum_gb_approx: 5.1
  shrink_order_if_over_cap: [extractor, verifier]
  models:
    - instance: orchestrator_drafter
      roles: [orchestrator, drafter]
      hf_id: Qwen/Qwen2.5-1.5B-Instruct
      gguf: F16
      weight_gb_approx: 3.1
    - instance: extractor
      roles: [extractor]
      hf_id: Qwen/Qwen2.5-0.5B-Instruct
      gguf: F16
      weight_gb_approx: 1.0
    - instance: verifier
      roles: [verifier]
      hf_id: Qwen/Qwen2.5-0.5B-Instruct
      gguf: F16
      weight_gb_approx: 1.0
  retriever:
    hf_id: BAAI/bge-small-en-v1.5
    generative: false
  token_schedule:
    extractor: 0.30
    retriever: 0.10
    drafter: 0.40
    verifier: 0.20
    reserve_verifier_first: true
