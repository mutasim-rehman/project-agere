# Hardware Tier: 4 GB (Ultra-Edge / Mobile)
# Tier 1 of 15 — Example hardware: RTX 3050 Mobile, Intel Arc A380
# Experimental Framework: 2x2 Factorial Design (Architecture x Precision)

tier:
  name: "4gb"
  label: "Tier 1 — Ultra-Edge / Mobile"
  vram_budget_gb: 4
  example_hardware: "RTX 3050 Mobile, Intel Arc A380"

  memory_parity_protocol:
    target_memory_utilization_ratio: 0.95
    target_resident_vram_gb: 3.8
    enforce_runtime_kv_saturation: true
    max_weight_vram_gb: 3.0
    runtime_overhead_reserve_gb: 0.5

# ============================================================
# 2x2 FACTORIAL EXPERIMENTAL DESIGN CELLS
# All 4 cells strictly equated to >= 95% physical VRAM saturation
# ============================================================
factorial_design:
  # CELL A: Single-Agent FP16 (Control Baseline)
  cell_a_sas_fp16:
    model: "Qwen/Qwen2.5-1.5B-Instruct"
    quantization: "FP16"
    weight_vram_gb: 3.0
    allocated_kv_cache_gb: 0.8
    total_resident_vram_gb: 3.8
    vram_utilization_pct: 95.0
    role: "Control Baseline (Bench360 lower anchor)"

  # CELL B: Single-Agent Quantized (Scaled-up Single Model)
  cell_b_sas_quant:
    model: "Qwen/Qwen2.5-3B-Instruct"
    quantization: "INT8"
    weight_vram_gb: 3.0
    allocated_kv_cache_gb: 0.8
    total_resident_vram_gb: 3.8
    vram_utilization_pct: 95.0
    role: "Scaled Quantized Generalist (Bench360 winner at single-model level)"

  # CELL C: Multi-Agent FP16 (Original MAS Hypothesis)
  cell_c_mas_fp16:
    config_id: "MAS-4G-C"
    layout: "3× 0.5B FP16"
    weight_vram_gb: 3.0
    allocated_kv_cache_gb: 0.8
    total_resident_vram_gb: 3.8
    vram_utilization_pct: 95.0
    role: "3-agent pipeline/AHDS at native FP16"

  # CELL D: Multi-Agent Quantized (NEW: Larger Sub-Agents, Quantized & Orchestrated)
  cell_d_mas_quant:
    config_id: "MAS-Q-4G"
    layout: "1× 3B @ INT4 (orch) + 1× 1.5B @ INT8 (worker)"
    agents:
      - role: "orchestrator"
        model: "Qwen/Qwen2.5-3B-Instruct"
        quantization: "INT4-AWQ"
        estimated_vram_gb: 1.6
      - role: "worker"
        model: "Qwen/Qwen2.5-1.5B-Instruct"
        quantization: "INT8"
        estimated_vram_gb: 1.5
    weight_vram_gb: 3.1
    allocated_kv_cache_gb: 0.7
    total_resident_vram_gb: 3.8
    vram_utilization_pct: 95.0
    scientific_mechanism: "Scales orch from 0.5B to 3B via INT4; worker from 0.5B to 1.5B via INT8"

