# Hardware Tier: 28 GB (Professional Entry)
# Tier 13 of 15 — Example hardware: A100-40GB partial, RTX 5090
# Experimental Framework: 2x2 Factorial Design (Architecture x Precision)

tier:
  name: "28gb"
  label: "Tier 13 — Professional Entry"
  vram_budget_gb: 28
  example_hardware: "A100-40GB partial, RTX 5090"

  memory_parity_protocol:
    target_memory_utilization_ratio: 0.95
    target_resident_vram_gb: 26.6
    enforce_runtime_kv_saturation: true
    max_weight_vram_gb: 26.0
    runtime_overhead_reserve_gb: 1.0

# ============================================================
# 2x2 FACTORIAL EXPERIMENTAL DESIGN CELLS
# All 4 cells strictly equated to >= 95% physical VRAM saturation
# ============================================================
factorial_design:
  # CELL A: Single-Agent FP16 (Control Baseline)
  cell_a_sas_fp16:
    model: "Qwen/Qwen2.5-7B-Instruct"
    quantization: "FP16"
    weight_vram_gb: 14.0
    allocated_kv_cache_gb: 12.6
    total_resident_vram_gb: 26.6
    vram_utilization_pct: 95.0
    role: "Control Baseline (Bench360 lower anchor)"

  # CELL B: Single-Agent Quantized (Scaled-up Single Model)
  cell_b_sas_quant:
    model: "Qwen/Qwen2.5-72B-Instruct"
    quantization: "3-bit (Q3_K)"
    weight_vram_gb: 26.5
    allocated_kv_cache_gb: 1.0
    total_resident_vram_gb: 27.5
    vram_utilization_pct: 98.2
    role: "Scaled Quantized Generalist (Bench360 winner at single-model level)"

  # CELL C: Multi-Agent FP16 (Original MAS Hypothesis)
  cell_c_mas_fp16:
    config_id: "MAS-28G-C"
    layout: "1× 7B + 1× 3B + 1× 3B FP16"
    weight_vram_gb: 26.0
    allocated_kv_cache_gb: 1.5
    total_resident_vram_gb: 27.5
    vram_utilization_pct: 98.2
    role: "7B + dual-3B FP16"

  # CELL D: Multi-Agent Quantized (NEW: Larger Sub-Agents, Quantized & Orchestrated)
  cell_d_mas_quant:
    config_id: "MAS-Q-28G"
    layout: "1× 32B @ INT4 (orch) + 1× 7B @ INT8 (worker) + 1× 3B @ INT8 (verifier)"
    agents:
      - role: "orchestrator"
        model: "Qwen/Qwen2.5-32B-Instruct"
        quantization: "INT4-AWQ"
        estimated_vram_gb: 16.5
      - role: "worker"
        model: "Qwen/Qwen2.5-7B-Instruct"
        quantization: "INT8"
        estimated_vram_gb: 7.0
      - role: "verifier"
        model: "Qwen/Qwen2.5-3B-Instruct"
        quantization: "INT8"
        estimated_vram_gb: 3.0
    weight_vram_gb: 26.5
    allocated_kv_cache_gb: 1.0
    total_resident_vram_gb: 27.5
    vram_utilization_pct: 98.2
    scientific_mechanism: "32B INT4 orch + 7B worker + 3B verifier"

