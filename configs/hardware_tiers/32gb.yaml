# Hardware Tier: 32 GB (Professional / Multi-GPU)
# Tier 15 of 15 — Example hardware: V100-32GB, A100-40GB partial, RTX 5090
# Experimental Framework: 2x2 Factorial Design (Architecture x Precision)

tier:
  name: "32gb"
  label: "Tier 15 — Professional / Multi-GPU"
  vram_budget_gb: 32
  example_hardware: "V100-32GB, A100-40GB partial, RTX 5090"

  memory_parity_protocol:
    target_memory_utilization_ratio: 0.95
    target_resident_vram_gb: 30.4
    enforce_runtime_kv_saturation: true
    max_weight_vram_gb: 30.0
    runtime_overhead_reserve_gb: 1.0

# ============================================================
# 2x2 FACTORIAL EXPERIMENTAL DESIGN CELLS
# All 4 cells strictly equated to >= 95% physical VRAM saturation
# ============================================================
factorial_design:
  # CELL A: Single-Agent FP16 (Control Baseline)
  cell_a_sas_fp16:
    model: "Qwen/Qwen2.5-14B-Instruct"
    quantization: "FP16"
    weight_vram_gb: 28.0
    allocated_kv_cache_gb: 2.5
    total_resident_vram_gb: 30.5
    vram_utilization_pct: 95.3
    role: "Control Baseline (Bench360 lower anchor)"

  # CELL B: Single-Agent Quantized (Scaled-up Single Model)
  cell_b_sas_quant:
    model: "Qwen/Qwen2.5-72B-Instruct"
    quantization: "3.5-bit (AWQ)"
    weight_vram_gb: 29.5
    allocated_kv_cache_gb: 1.5
    total_resident_vram_gb: 31.0
    vram_utilization_pct: 96.9
    role: "Scaled Quantized Generalist (Bench360 winner at single-model level)"

  # CELL C: Multi-Agent FP16 (Original MAS Hypothesis)
  cell_c_mas_fp16:
    config_id: "MAS-32G-A"
    layout: "1× 14B (orch) + 1× 1.5B (worker) FP16"
    weight_vram_gb: 31.0
    allocated_kv_cache_gb: 0.8
    total_resident_vram_gb: 31.8
    vram_utilization_pct: 99.4
    role: "14B orch + 1.5B worker FP16"

  # CELL D: Multi-Agent Quantized (NEW: Larger Sub-Agents, Quantized & Orchestrated)
  cell_d_mas_quant:
    config_id: "MAS-Q-32G"
    layout: "1× 32B @ INT4 (orch) + 1× 14B @ INT4 (worker) + 1× 7B @ INT4 (verifier)"
    agents:
      - role: "orchestrator"
        model: "Qwen/Qwen2.5-32B-Instruct"
        quantization: "INT4-AWQ"
        estimated_vram_gb: 16.5
      - role: "worker"
        model: "Qwen/Qwen2.5-14B-Instruct"
        quantization: "INT4-AWQ"
        estimated_vram_gb: 7.6
      - role: "verifier"
        model: "Qwen/Qwen2.5-7B-Instruct"
        quantization: "INT4-AWQ"
        estimated_vram_gb: 3.8
    weight_vram_gb: 27.9
    allocated_kv_cache_gb: 3.0
    total_resident_vram_gb: 30.9
    vram_utilization_pct: 96.6
    scientific_mechanism: "Massive 32B orch + 14B worker + 7B verifier team"

