# Hardware Tier: 26 GB (Extended Flagship)
# Tier 12 of 15 — Example hardware: Partial A100, fractional H100
# Experimental Framework: 2x2 Factorial Design (Architecture x Precision)

tier:
  name: "26gb"
  label: "Tier 12 — Extended Flagship"
  vram_budget_gb: 26
  example_hardware: "Partial A100, fractional H100"

  memory_parity_protocol:
    target_memory_utilization_ratio: 0.95
    target_resident_vram_gb: 24.7
    enforce_runtime_kv_saturation: true
    max_weight_vram_gb: 24.0
    runtime_overhead_reserve_gb: 1.0

# ============================================================
# 2x2 FACTORIAL EXPERIMENTAL DESIGN CELLS
# All 4 cells strictly equated to >= 95% physical VRAM saturation
# ============================================================
factorial_design:
  # CELL A: Single-Agent FP16 (Control Baseline)
  cell_a_sas_fp16:
    model: "Qwen/Qwen2.5-7B-Instruct"
    quantization: "FP16"
    weight_vram_gb: 14.0
    allocated_kv_cache_gb: 10.7
    total_resident_vram_gb: 24.7
    vram_utilization_pct: 95.0
    role: "Control Baseline (Bench360 lower anchor)"

  # CELL B: Single-Agent Quantized (Scaled-up Single Model)
  cell_b_sas_quant:
    model: "Qwen/Qwen2.5-32B-Instruct"
    quantization: "INT6 (Q6_K)"
    weight_vram_gb: 24.0
    allocated_kv_cache_gb: 1.5
    total_resident_vram_gb: 25.5
    vram_utilization_pct: 98.1
    role: "Scaled Quantized Generalist (Bench360 winner at single-model level)"

  # CELL C: Multi-Agent FP16 (Original MAS Hypothesis)
  cell_c_mas_fp16:
    config_id: "MAS-26G-C"
    layout: "1× 7B + 1× 3B + 1× 1.5B FP16"
    weight_vram_gb: 23.0
    allocated_kv_cache_gb: 2.5
    total_resident_vram_gb: 25.5
    vram_utilization_pct: 98.1
    role: "7B + 3B + 1.5B FP16 with expanded KV"

  # CELL D: Multi-Agent Quantized (NEW: Larger Sub-Agents, Quantized & Orchestrated)
  cell_d_mas_quant:
    config_id: "MAS-Q-26G"
    layout: "1× 32B @ INT4 (orch) + 1× 7B @ INT8 (worker) + 1× 1.5B @ INT8 (verifier)"
    agents:
      - role: "orchestrator"
        model: "Qwen/Qwen2.5-32B-Instruct"
        quantization: "INT4-AWQ"
        estimated_vram_gb: 16.5
      - role: "worker"
        model: "Qwen/Qwen2.5-7B-Instruct"
        quantization: "INT8"
        estimated_vram_gb: 7.0
      - role: "verifier"
        model: "Qwen/Qwen2.5-1.5B-Instruct"
        quantization: "INT8"
        estimated_vram_gb: 1.5
    weight_vram_gb: 25.0
    allocated_kv_cache_gb: 0.8
    total_resident_vram_gb: 25.8
    vram_utilization_pct: 99.2
    scientific_mechanism: "32B INT4 orch + 7B worker + 1.5B verifier"

