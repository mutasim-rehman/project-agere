# Hardware Tier: 12 GB (Mainstream Workstation)
# Tier 5 of 15 — Example hardware: RTX 4070, Tesla T4
# Experimental Framework: 2x2 Factorial Design (Architecture x Precision)

tier:
  name: "12gb"
  label: "Tier 5 — Mainstream Workstation"
  vram_budget_gb: 12
  example_hardware: "RTX 4070, Tesla T4"

  memory_parity_protocol:
    target_memory_utilization_ratio: 0.95
    target_resident_vram_gb: 11.4
    enforce_runtime_kv_saturation: true
    max_weight_vram_gb: 11.0
    runtime_overhead_reserve_gb: 0.5

# ============================================================
# 2x2 FACTORIAL EXPERIMENTAL DESIGN CELLS
# All 4 cells strictly equated to >= 95% physical VRAM saturation
# ============================================================
factorial_design:
  # CELL A: Single-Agent FP16 (Control Baseline)
  cell_a_sas_fp16:
    model: "Qwen/Qwen2.5-3B-Instruct"
    quantization: "FP16"
    weight_vram_gb: 6.0
    allocated_kv_cache_gb: 5.4
    total_resident_vram_gb: 11.4
    vram_utilization_pct: 95.0
    role: "Control Baseline (Bench360 lower anchor)"

  # CELL B: Single-Agent Quantized (Scaled-up Single Model)
  cell_b_sas_quant:
    model: "Qwen/Qwen2.5-14B-Instruct"
    quantization: "INT6 (Q6_K)"
    weight_vram_gb: 10.5
    allocated_kv_cache_gb: 1.2
    total_resident_vram_gb: 11.7
    vram_utilization_pct: 97.5
    role: "Scaled Quantized Generalist (Bench360 winner at single-model level)"

  # CELL C: Multi-Agent FP16 (Original MAS Hypothesis)
  cell_c_mas_fp16:
    config_id: "MAS-12G-A"
    layout: "1× 3B (orch) + 1× 1.5B + 2× 0.5B FP16"
    weight_vram_gb: 11.0
    allocated_kv_cache_gb: 0.8
    total_resident_vram_gb: 11.8
    vram_utilization_pct: 98.3
    role: "4-agent FP16 team"

  # CELL D: Multi-Agent Quantized (NEW: Larger Sub-Agents, Quantized & Orchestrated)
  cell_d_mas_quant:
    config_id: "MAS-Q-12G"
    layout: "1× 14B @ INT4 (orch) + 1× 3B @ INT8 (worker)"
    agents:
      - role: "orchestrator"
        model: "Qwen/Qwen2.5-14B-Instruct"
        quantization: "INT4-AWQ"
        estimated_vram_gb: 7.6
      - role: "worker"
        model: "Qwen/Qwen2.5-3B-Instruct"
        quantization: "INT8"
        estimated_vram_gb: 3.0
    weight_vram_gb: 10.6
    allocated_kv_cache_gb: 1.0
    total_resident_vram_gb: 11.6
    vram_utilization_pct: 96.7
    scientific_mechanism: "14B orch + 3B worker replacing four small models"

