# Hardware Tier: 24 GB (Flagship Single-GPU)
# Tier 11 of 15 — Example hardware: RTX 3090, RTX 4090, A10G
# Experimental Framework: 2x2 Factorial Design (Architecture x Precision)

tier:
  name: "24gb"
  label: "Tier 11 — Flagship Single-GPU"
  vram_budget_gb: 24
  example_hardware: "RTX 3090, RTX 4090, A10G"

  memory_parity_protocol:
    target_memory_utilization_ratio: 0.95
    target_resident_vram_gb: 22.8
    enforce_runtime_kv_saturation: true
    max_weight_vram_gb: 22.0
    runtime_overhead_reserve_gb: 1.0

# ============================================================
# 2x2 FACTORIAL EXPERIMENTAL DESIGN CELLS
# All 4 cells strictly equated to >= 95% physical VRAM saturation
# ============================================================
factorial_design:
  # CELL A: Single-Agent FP16 (Control Baseline)
  cell_a_sas_fp16:
    model: "Qwen/Qwen2.5-7B-Instruct"
    quantization: "FP16"
    weight_vram_gb: 14.0
    allocated_kv_cache_gb: 8.8
    total_resident_vram_gb: 22.8
    vram_utilization_pct: 95.0
    role: "Control Baseline (Bench360 lower anchor)"

  # CELL B: Single-Agent Quantized (Scaled-up Single Model)
  cell_b_sas_quant:
    model: "Qwen/Qwen2.5-72B-Instruct"
    quantization: "2.5-bit (AQLM)"
    weight_vram_gb: 22.5
    allocated_kv_cache_gb: 1.0
    total_resident_vram_gb: 23.5
    vram_utilization_pct: 97.9
    role: "Scaled Quantized Generalist (Bench360 winner at single-model level)"

  # CELL C: Multi-Agent FP16 (Original MAS Hypothesis)
  cell_c_mas_fp16:
    config_id: "MAS-24G-D"
    layout: "1× 7B (orch) + 1× 3B + 1× 1.5B FP16"
    weight_vram_gb: 23.0
    allocated_kv_cache_gb: 0.8
    total_resident_vram_gb: 23.8
    vram_utilization_pct: 99.2
    role: "7B orch + 3B worker + 1.5B verifier FP16"

  # CELL D: Multi-Agent Quantized (NEW: Larger Sub-Agents, Quantized & Orchestrated)
  cell_d_mas_quant:
    config_id: "MAS-Q-24G"
    layout: "1× 32B @ INT4 (orch) + 1× 7B @ INT8 (worker)"
    agents:
      - role: "orchestrator"
        model: "Qwen/Qwen2.5-32B-Instruct"
        quantization: "INT4-AWQ"
        estimated_vram_gb: 16.5
      - role: "worker"
        model: "Qwen/Qwen2.5-7B-Instruct"
        quantization: "INT8"
        estimated_vram_gb: 7.0
    weight_vram_gb: 23.5
    allocated_kv_cache_gb: 0.4
    total_resident_vram_gb: 23.9
    vram_utilization_pct: 99.6
    scientific_mechanism: "Unlocks a 32B orchestrator @ INT4 + 7B worker @ INT8"

