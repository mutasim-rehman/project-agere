# Hardware Tier: 14 GB (Mid-Range Workstation)
# Tier 6 of 15 — Example hardware: RTX 4060 Ti 16GB, Intel Arc A770
# Experimental Framework: 2x2 Factorial Design (Architecture x Precision)

tier:
  name: "14gb"
  label: "Tier 6 — Mid-Range Workstation"
  vram_budget_gb: 14
  example_hardware: "RTX 4060 Ti 16GB, Intel Arc A770"

  memory_parity_protocol:
    target_memory_utilization_ratio: 0.95
    target_resident_vram_gb: 13.3
    enforce_runtime_kv_saturation: true
    max_weight_vram_gb: 13.0
    runtime_overhead_reserve_gb: 0.5

# ============================================================
# 2x2 FACTORIAL EXPERIMENTAL DESIGN CELLS
# All 4 cells strictly equated to >= 95% physical VRAM saturation
# ============================================================
factorial_design:
  # CELL A: Single-Agent FP16 (Control Baseline)
  cell_a_sas_fp16:
    model: "Qwen/Qwen2.5-3B-Instruct"
    quantization: "FP16"
    weight_vram_gb: 6.0
    allocated_kv_cache_gb: 7.3
    total_resident_vram_gb: 13.3
    vram_utilization_pct: 95.0
    role: "Control Baseline (Bench360 lower anchor)"

  # CELL B: Single-Agent Quantized (Scaled-up Single Model)
  cell_b_sas_quant:
    model: "Qwen/Qwen2.5-32B-Instruct"
    quantization: "INT3 (Q3_K)"
    weight_vram_gb: 12.0
    allocated_kv_cache_gb: 1.5
    total_resident_vram_gb: 13.5
    vram_utilization_pct: 96.4
    role: "Scaled Quantized Generalist (Bench360 winner at single-model level)"

  # CELL C: Multi-Agent FP16 (Original MAS Hypothesis)
  cell_c_mas_fp16:
    config_id: "MAS-14G-D"
    layout: "1× 3B (orch) + 1× 3B (worker) + 1× 0.5B (verifier) FP16"
    weight_vram_gb: 13.0
    allocated_kv_cache_gb: 0.8
    total_resident_vram_gb: 13.8
    vram_utilization_pct: 98.6
    role: "Dual-3B + 0.5B verifier FP16"

  # CELL D: Multi-Agent Quantized (NEW: Larger Sub-Agents, Quantized & Orchestrated)
  cell_d_mas_quant:
    config_id: "MAS-Q-14G"
    layout: "1× 14B @ INT4 (orch) + 1× 7B @ INT4 (worker) + 1× 1.5B @ INT8 (verifier)"
    agents:
      - role: "orchestrator"
        model: "Qwen/Qwen2.5-14B-Instruct"
        quantization: "INT4-AWQ"
        estimated_vram_gb: 7.6
      - role: "worker"
        model: "Qwen/Qwen2.5-7B-Instruct"
        quantization: "INT4-AWQ"
        estimated_vram_gb: 3.8
      - role: "verifier"
        model: "Qwen/Qwen2.5-1.5B-Instruct"
        quantization: "INT8"
        estimated_vram_gb: 1.5
    weight_vram_gb: 12.9
    allocated_kv_cache_gb: 0.8
    total_resident_vram_gb: 13.7
    vram_utilization_pct: 97.9
    scientific_mechanism: "Full 3-agent AHDS with 14B orch + 7B worker + 1.5B verifier"

