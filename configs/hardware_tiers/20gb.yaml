# Hardware Tier: 20 GB (High-End Workstation)
# Tier 9 of 15 — Example hardware: RTX 3080 20GB, A30 partial
# Experimental Framework: 2x2 Factorial Design (Architecture x Precision)

tier:
  name: "20gb"
  label: "Tier 9 — High-End Workstation"
  vram_budget_gb: 20
  example_hardware: "RTX 3080 20GB, A30 partial"

  memory_parity_protocol:
    target_memory_utilization_ratio: 0.95
    target_resident_vram_gb: 19.0
    enforce_runtime_kv_saturation: true
    max_weight_vram_gb: 18.0
    runtime_overhead_reserve_gb: 1.0

# ============================================================
# 2x2 FACTORIAL EXPERIMENTAL DESIGN CELLS
# All 4 cells strictly equated to >= 95% physical VRAM saturation
# ============================================================
factorial_design:
  # CELL A: Single-Agent FP16 (Control Baseline)
  cell_a_sas_fp16:
    model: "Qwen/Qwen2.5-7B-Instruct"
    quantization: "FP16"
    weight_vram_gb: 14.0
    allocated_kv_cache_gb: 5.2
    total_resident_vram_gb: 19.2
    vram_utilization_pct: 96.0
    role: "Control Baseline (Bench360 lower anchor)"

  # CELL B: Single-Agent Quantized (Scaled-up Single Model)
  cell_b_sas_quant:
    model: "Qwen/Qwen2.5-72B-Instruct"
    quantization: "2-bit (AQLM)"
    weight_vram_gb: 18.0
    allocated_kv_cache_gb: 1.2
    total_resident_vram_gb: 19.2
    vram_utilization_pct: 96.0
    role: "Scaled Quantized Generalist (Bench360 winner at single-model level)"

  # CELL C: Multi-Agent FP16 (Original MAS Hypothesis)
  cell_c_mas_fp16:
    config_id: "MAS-20G-D"
    layout: "1× 7B (orch) + 1× 1.5B + 1× 0.5B FP16"
    weight_vram_gb: 18.5
    allocated_kv_cache_gb: 1.0
    total_resident_vram_gb: 19.5
    vram_utilization_pct: 97.5
    role: "7B orch + 1.5B worker + 0.5B verifier FP16"

  # CELL D: Multi-Agent Quantized (NEW: Larger Sub-Agents, Quantized & Orchestrated)
  cell_d_mas_quant:
    config_id: "MAS-Q-20G"
    layout: "1× 14B @ INT8 (orch) + 1× 7B @ INT4 (worker) + 1× 1.5B @ INT8 (verifier)"
    agents:
      - role: "orchestrator"
        model: "Qwen/Qwen2.5-14B-Instruct"
        quantization: "INT8"
        estimated_vram_gb: 14.0
      - role: "worker"
        model: "Qwen/Qwen2.5-7B-Instruct"
        quantization: "INT4-AWQ"
        estimated_vram_gb: 3.8
      - role: "verifier"
        model: "Qwen/Qwen2.5-1.5B-Instruct"
        quantization: "INT8"
        estimated_vram_gb: 1.5
    weight_vram_gb: 19.3
    allocated_kv_cache_gb: 0.5
    total_resident_vram_gb: 19.8
    vram_utilization_pct: 99.0
    scientific_mechanism: "14B INT8 orch + 7B worker + 1.5B verifier"

