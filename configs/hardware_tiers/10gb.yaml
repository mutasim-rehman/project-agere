# Hardware Tier: 10 GB (Apple Unified / Cloud Fractional)
# Tier 4 of 15 — Example hardware: Apple M-series 10GB, fractional cloud GPU
# Experimental Framework: 2x2 Factorial Design (Architecture x Precision)

tier:
  name: "10gb"
  label: "Tier 4 — Apple Unified / Cloud Fractional"
  vram_budget_gb: 10
  example_hardware: "Apple M-series 10GB, fractional cloud GPU"

  memory_parity_protocol:
    target_memory_utilization_ratio: 0.95
    target_resident_vram_gb: 9.5
    enforce_runtime_kv_saturation: true
    max_weight_vram_gb: 9.0
    runtime_overhead_reserve_gb: 0.5

# ============================================================
# 2x2 FACTORIAL EXPERIMENTAL DESIGN CELLS
# All 4 cells strictly equated to >= 95% physical VRAM saturation
# ============================================================
factorial_design:
  # CELL A: Single-Agent FP16 (Control Baseline)
  cell_a_sas_fp16:
    model: "Qwen/Qwen2.5-3B-Instruct"
    quantization: "FP16"
    weight_vram_gb: 6.0
    allocated_kv_cache_gb: 3.5
    total_resident_vram_gb: 9.5
    vram_utilization_pct: 95.0
    role: "Control Baseline (Bench360 lower anchor)"

  # CELL B: Single-Agent Quantized (Scaled-up Single Model)
  cell_b_sas_quant:
    model: "Qwen/Qwen2.5-14B-Instruct"
    quantization: "INT5 (Q5_K)"
    weight_vram_gb: 8.8
    allocated_kv_cache_gb: 0.8
    total_resident_vram_gb: 9.6
    vram_utilization_pct: 96.0
    role: "Scaled Quantized Generalist (Bench360 winner at single-model level)"

  # CELL C: Multi-Agent FP16 (Original MAS Hypothesis)
  cell_c_mas_fp16:
    config_id: "MAS-10G-A"
    layout: "1× 3B (orch) + 1× 1.5B (worker) FP16"
    weight_vram_gb: 9.0
    allocated_kv_cache_gb: 0.8
    total_resident_vram_gb: 9.8
    vram_utilization_pct: 98.0
    role: "3B orch + 1.5B worker FP16"

  # CELL D: Multi-Agent Quantized (NEW: Larger Sub-Agents, Quantized & Orchestrated)
  cell_d_mas_quant:
    config_id: "MAS-Q-10G"
    layout: "1× 14B @ INT4 (orch) + 1× 1.5B @ INT8 (worker)"
    agents:
      - role: "orchestrator"
        model: "Qwen/Qwen2.5-14B-Instruct"
        quantization: "INT4-AWQ"
        estimated_vram_gb: 7.6
      - role: "worker"
        model: "Qwen/Qwen2.5-1.5B-Instruct"
        quantization: "INT8"
        estimated_vram_gb: 1.5
    weight_vram_gb: 9.1
    allocated_kv_cache_gb: 0.6
    total_resident_vram_gb: 9.7
    vram_utilization_pct: 97.0
    scientific_mechanism: "Unlocks a 14B orchestrator at 10 GB via INT4"

