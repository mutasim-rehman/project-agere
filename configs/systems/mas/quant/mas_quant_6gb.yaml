# Quantized Multi-Agent System (Cell D) — 6 GB Tier
# Architecture: MAS-Q-6G — 1× 7B @ INT4 (orch) + 1× 1.5B @ INT8 (worker)

architecture: "quantized_mas"
tier: "6gb"
vram_budget_gb: 6
layout: "1× 7B @ INT4 (orch) + 1× 1.5B @ INT8 (worker)"
scientific_mechanism: "Scales orch from 1.5B to 7B via INT4"

memory_utilization_target: 0.95
total_weight_vram_gb: 5.3
allocated_kv_cache_gb: 0.5
total_resident_vram_gb: 5.8
vram_utilization_pct: 96.7

agents:
  - role: "orchestrator"
    model: "Qwen/Qwen2.5-7B-Instruct"
    quantization: "INT4-AWQ"
    estimated_weight_vram_gb: 3.8
  - role: "worker"
    model: "Qwen/Qwen2.5-1.5B-Instruct"
    quantization: "INT8"
    estimated_weight_vram_gb: 1.5
