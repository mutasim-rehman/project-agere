# Quantized Multi-Agent System (Cell D) — 4 GB Tier
# Architecture: MAS-Q-4G — 1× 3B @ INT4 (orch) + 1× 1.5B @ INT8 (worker)

architecture: "quantized_mas"
tier: "4gb"
vram_budget_gb: 4
layout: "1× 3B @ INT4 (orch) + 1× 1.5B @ INT8 (worker)"
scientific_mechanism: "Scales orch from 0.5B to 3B via INT4; worker from 0.5B to 1.5B via INT8"

memory_utilization_target: 0.95
total_weight_vram_gb: 3.1
allocated_kv_cache_gb: 0.7
total_resident_vram_gb: 3.8
vram_utilization_pct: 95.0

agents:
  - role: "orchestrator"
    model: "Qwen/Qwen2.5-3B-Instruct"
    quantization: "INT4-AWQ"
    estimated_weight_vram_gb: 1.6
  - role: "worker"
    model: "Qwen/Qwen2.5-1.5B-Instruct"
    quantization: "INT8"
    estimated_weight_vram_gb: 1.5
