# Quantized Multi-Agent System (Cell D) — 10 GB Tier
# Architecture: MAS-Q-10G — 1× 14B @ INT4 (orch) + 1× 1.5B @ INT8 (worker)

architecture: "quantized_mas"
tier: "10gb"
vram_budget_gb: 10
layout: "1× 14B @ INT4 (orch) + 1× 1.5B @ INT8 (worker)"
scientific_mechanism: "Unlocks a 14B orchestrator at 10 GB via INT4"

memory_utilization_target: 0.95
total_weight_vram_gb: 9.1
allocated_kv_cache_gb: 0.6
total_resident_vram_gb: 9.7
vram_utilization_pct: 97.0

agents:
  - role: "orchestrator"
    model: "Qwen/Qwen2.5-14B-Instruct"
    quantization: "INT4-AWQ"
    estimated_weight_vram_gb: 7.6
  - role: "worker"
    model: "Qwen/Qwen2.5-1.5B-Instruct"
    quantization: "INT8"
    estimated_weight_vram_gb: 1.5
