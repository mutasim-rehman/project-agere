# Quantized Multi-Agent System (Cell D) — 20 GB Tier
# Architecture: MAS-Q-20G — 1× 14B @ INT8 (orch) + 1× 7B @ INT4 (worker) + 1× 1.5B @ INT8 (verifier)

architecture: "quantized_mas"
tier: "20gb"
vram_budget_gb: 20
layout: "1× 14B @ INT8 (orch) + 1× 7B @ INT4 (worker) + 1× 1.5B @ INT8 (verifier)"
scientific_mechanism: "14B INT8 orch + 7B worker + 1.5B verifier"

memory_utilization_target: 0.95
total_weight_vram_gb: 19.3
allocated_kv_cache_gb: 0.5
total_resident_vram_gb: 19.8
vram_utilization_pct: 99.0

agents:
  - role: "orchestrator"
    model: "Qwen/Qwen2.5-14B-Instruct"
    quantization: "INT8"
    estimated_weight_vram_gb: 14.0
  - role: "worker"
    model: "Qwen/Qwen2.5-7B-Instruct"
    quantization: "INT4-AWQ"
    estimated_weight_vram_gb: 3.8
  - role: "verifier"
    model: "Qwen/Qwen2.5-1.5B-Instruct"
    quantization: "INT8"
    estimated_weight_vram_gb: 1.5
