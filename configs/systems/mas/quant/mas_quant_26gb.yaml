# Quantized Multi-Agent System (Cell D) — 26 GB Tier
# Architecture: MAS-Q-26G — 1× 32B @ INT4 (orch) + 1× 7B @ INT8 (worker) + 1× 1.5B @ INT8 (verifier)

architecture: "quantized_mas"
tier: "26gb"
vram_budget_gb: 26
layout: "1× 32B @ INT4 (orch) + 1× 7B @ INT8 (worker) + 1× 1.5B @ INT8 (verifier)"
scientific_mechanism: "32B INT4 orch + 7B worker + 1.5B verifier"

memory_utilization_target: 0.95
total_weight_vram_gb: 25.0
allocated_kv_cache_gb: 0.8
total_resident_vram_gb: 25.8
vram_utilization_pct: 99.2

agents:
  - role: "orchestrator"
    model: "Qwen/Qwen2.5-32B-Instruct"
    quantization: "INT4-AWQ"
    estimated_weight_vram_gb: 16.5
  - role: "worker"
    model: "Qwen/Qwen2.5-7B-Instruct"
    quantization: "INT8"
    estimated_weight_vram_gb: 7.0
  - role: "verifier"
    model: "Qwen/Qwen2.5-1.5B-Instruct"
    quantization: "INT8"
    estimated_weight_vram_gb: 1.5
