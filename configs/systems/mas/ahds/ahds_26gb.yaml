# AHDS Configuration — 26 GB Tier (Native FP16)
# Adaptive Hierarchical with Dynamic Pruning & Structured Communication

architecture: "ahds"
tier: "26gb"
vram_budget_gb: 26
strategy: "3-agent, full AHDS"
num_agents: 3

# --- Memory Utilization Parity Protocol (MUPP) ---
memory_utilization_target: 0.95
total_weight_vram_gb: 23.0
allocated_kv_cache_gb: 2.5
total_resident_vram_gb: 25.5
vram_utilization_pct: 98.1

# --- AHDS Hyperparameters ---
confidence_threshold_tau: 0.7
max_worker_token_budget: 256
early_termination: true
structured_communication: true
paged_attention_sharing: true

# --- Agent Definitions (ALL FP16 — Native Precision Only) ---
orchestrator:
  model: "Qwen/Qwen2.5-7B-Instruct"
  quantization: "FP16"
  estimated_vram_gb: 14.0

workers:
  - role: "reasoning_worker"
    model: "Qwen/Qwen2.5-3B-Instruct"
    quantization: "FP16"
    estimated_vram_gb: 6.0
    activation: "dynamic"

verifier:
  model: "Qwen/Qwen2.5-1.5B-Instruct"
  quantization: "FP16"
  estimated_vram_gb: 3.0
  activation: "always"

