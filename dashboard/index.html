<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Agere — Research Analytics</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23a78bfa'/><stop offset='1' stop-color='%2338bdf8'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><text x='16' y='22' font-family='Arial' font-weight='700' font-size='16' text-anchor='middle' fill='white'>A</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
            corePlugins: { preflight: true }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="ambient"></div>
    <div class="app-container">
        <aside class="sidebar">
            <div class="p-4 flex items-center gap-3 border-b border-[var(--border-color)]">
                <div class="brand-mark">A</div>
                <div class="brand-text">
                    <div class="font-bold text-sm tracking-tight t-primary">Project Agere</div>
                    <div class="text-[11px] t-muted">Local LLM deployment study</div>
                </div>
            </div>

            <nav class="flex-1 overflow-y-auto py-2">
                <div class="nav-group-title">Story</div>
                <a class="nav-item active" data-tab="overview">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                    <span class="nav-label">Overview</span>
                </a>
                <a class="nav-item" data-tab="comparison">
                    <i data-lucide="swords" class="w-4 h-4"></i>
                    <span class="nav-label">MAS vs SAS</span>
                </a>
                <a class="nav-item" data-tab="cases">
                    <i data-lucide="search" class="w-4 h-4"></i>
                    <span class="nav-label">Case Explorer</span>
                    <span class="nav-badge">1,728</span>
                </a>

                <div class="nav-group-title">Analysis</div>
                <a class="nav-item" data-tab="statistics">
                    <i data-lucide="sigma" class="w-4 h-4"></i>
                    <span class="nav-label">Statistics</span>
                    <span class="nav-badge">126</span>
                </a>
                <a class="nav-item" data-tab="pipeline">
                    <i data-lucide="workflow" class="w-4 h-4"></i>
                    <span class="nav-label">Pipeline & Cost</span>
                </a>
                <a class="nav-item" data-tab="hardware">
                    <i data-lucide="memory-stick" class="w-4 h-4"></i>
                    <span class="nav-label">Memory & Swap</span>
                </a>
                <a class="nav-item" data-tab="runs">
                    <i data-lucide="layers" class="w-4 h-4"></i>
                    <span class="nav-label">8 GB Tier & Runs</span>
                </a>

                <div class="nav-group-title">Reference</div>
                <a class="nav-item" data-tab="datasets">
                    <i data-lucide="building-2" class="w-4 h-4"></i>
                    <span class="nav-label">Companies & Data</span>
                </a>
                <a class="nav-item" data-tab="models">
                    <i data-lucide="boxes" class="w-4 h-4"></i>
                    <span class="nav-label">Models & Tiers</span>
                </a>
                <a class="nav-item" data-tab="provenance">
                    <i data-lucide="shield-check" class="w-4 h-4"></i>
                    <span class="nav-label">Provenance</span>
                </a>
            </nav>

            <div class="sidebar-footer p-4 border-t border-[var(--border-color)]">
                <div class="flex items-center gap-2 text-[11px] t-secondary">
                    <span class="pulse-dot"></span> Phase 3 · analysis locked
                </div>
                <div class="text-[11px] t-muted font-mono mt-1">16 GB · 11.5 GB app ceiling</div>
            </div>
        </aside>

        <main class="main-content" id="main-scroll">
            <header class="top-header">
                <div class="min-w-0">
                    <h1 id="page-title" class="text-base font-semibold t-primary tracking-tight truncate">Overview</h1>
                    <div id="page-subtitle" class="text-xs t-muted truncate"></div>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <button id="theme-toggle" class="btn" title="Toggle theme">
                        <i data-lucide="sun" class="w-4 h-4"></i>
                    </button>
                    <button class="btn" onclick="window.App.exportData()" title="Download the data loaded on this page">
                        <i data-lucide="download" class="w-4 h-4"></i><span class="hidden md:inline">Export</span>
                    </button>
                    <button class="btn btn-primary" onclick="window.App.showReproduceModal()">
                        <i data-lucide="terminal-square" class="w-4 h-4"></i><span class="hidden md:inline">Reproduce</span>
                    </button>
                </div>
            </header>

            <div id="content-container" class="p-6 space-y-6"></div>
        </main>
    </div>

    <div id="case-modal" class="modal-overlay" onclick="if (event.target === this) window.App.closeModal('case-modal')">
        <div class="modal-card">
            <div class="modal-header">
                <div>
                    <h3 id="modal-case-title" class="text-sm font-semibold t-primary">Case</h3>
                    <div id="modal-case-subtitle" class="text-xs t-secondary font-mono mt-0.5"></div>
                </div>
                <button class="btn p-1.5" onclick="window.App.closeModal('case-modal')">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <div id="modal-case-body" class="modal-body space-y-4"></div>
        </div>
    </div>

    <div id="figure-modal" class="modal-overlay" onclick="if (event.target === this) window.App.closeModal('figure-modal')">
        <div class="modal-card" style="max-width: 1100px">
            <div class="modal-header">
                <div>
                    <h3 id="figure-modal-title" class="text-sm font-semibold t-primary">Figure</h3>
                    <div id="figure-modal-caption" class="text-xs t-secondary mt-0.5"></div>
                </div>
                <button class="btn p-1.5" onclick="window.App.closeModal('figure-modal')">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <div class="modal-body text-center p-4">
                <img id="figure-modal-img" src="" alt="Figure" class="max-h-[75vh] mx-auto rounded-lg bg-white">
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/data.js"></script>
    <script src="js/pages/overview.js"></script>
    <script src="js/pages/comparison.js"></script>
    <script src="js/pages/caseExplorer.js"></script>
    <script src="js/pages/statistics.js"></script>
    <script src="js/pages/pipeline.js"></script>
    <script src="js/pages/hardware.js"></script>
    <script src="js/pages/runs.js"></script>
    <script src="js/pages/datasets.js"></script>
    <script src="js/pages/models.js"></script>
    <script src="js/pages/provenance.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => window.App.init());
    </script>
</body>
</html>
